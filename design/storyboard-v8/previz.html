<script type="module">
// Storyboard v8 previz: blockout of the walled dry garden on the cliff, his poses, the frozen particles and the
// camera through the shots. Scroll, drag the slider or use ←/→. ?s=<shot>&theme=light for a fixed frame.
// Poses are stand-ins: frozen frames of the rigged v6 ronin until the Meshy models. Trees, walls, gate and pagoda
// are placeholders built from primitives.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ramp = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;
const mmToFov = (mm) => (2 * Math.atan(12 / mm) * 180) / Math.PI;
const q = new URLSearchParams(location.search);
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ------------------------------------------------------------------ layout (he faces the moon, −Z)
const MOON = V(25, 40, -320);
const EDGE = -8; // the cliff edge; walls on the other three sides: x −14 / x 22 / z 18 (gate at x 0)
const HIS = V(0, 0, -6); // y is set to the top of his stone once it loads
const ROCKS = [[-6, -2, 1.3], [5, -1, 1.0], [-4.6, 5, 0.8], [6.5, 12.5, 1.1], [-3.8, 16, 0.7]]; // x, z, scale
const STONES = Array.from({ length: 13 }, (_, i) => { const z = -3.2 + i * 1.6; return [0.45 * Math.sin(z * 0.7), z]; });
const KATA = [ // the Approach ghosts beside the path, walking away from him toward the gate: z, side
  { z: 0, side: -1, pose: "P1" }, { z: 3.6, side: 1, pose: "P2" }, { z: 7.2, side: -1, pose: "P3" }, { z: 10.8, side: 1, pose: "P5" },
];
const P4AT = V(-10.4, 0, 6.6), TARGETS = [[-9.4, 8.6], [-9.7, 9.8], [-9.3, 11.0], [-9.6, 12.2]], BRAZIER = V(-8, 0, 13.8);
const ARMS = V(12.2, 0.6, 5); // the weapon rack, on the veranda: set from the house's floor once it loads
const TREES = [ // x, z, height, lean, turn: placeholders (curved trunk + flat pads)
  [-9.5, -7.3, 7, 1.2, 2.6], [11.5, -7, 6, 1, 0.4], [-12, -4, 5, 0.5, 1], [-11, 15.5, 4.5, 0.6, 2], [4.6, 8.6, 3.2, 0.7, 4],
  [-17.5, 2, 9, 0.4, 1], [-17, 12, 7.5, 0.6, 3], [-7, 21.5, 8, 0.5, 5], [7, 22, 10, 0.4, 2], [17, 21, 7, 0.6, 1], [25.5, 0, 9, 0.5, 4], [25, 12, 8, 0.4, 0],
];

// ------------------------------------------------------------------ renderer, scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x160707, 0.028);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 3000);

const glowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.25, "rgba(255,255,255,.3)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
})();
const sprite = (color, s, k, pos) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: k })); m.scale.setScalar(s); m.position.copy(pos); scene.add(m); return m; };
const box = (w, h, d, mat, x, y, z, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; };
const faceTo = (o, t) => { o.rotation.y = Math.atan2(t.x - o.position.x, t.z - o.position.z); }; // models face +Z
const Std = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.95 });
const M = { stone: Std(0x2c2b2c), plaster: Std(0x3a3330), tile: Std(0x141212), wood: Std(0x221813), tree: Object.assign(Std(0x16150f), { flatShading: true }), straw: Std(0x8a7a55) };

// ---------------- sky, moon / sun
const skyU = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, stars: { value: 1 } };
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: "varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: `varying vec3 p; uniform vec3 top, hor; uniform float stars;
    float h(vec3 q){ return fract(sin(dot(q, vec3(12.9898,78.233,37.719)))*43758.5453); }
    void main(){ vec3 n = normalize(p); vec3 c = mix(hor, top, smoothstep(-0.02, 0.45, n.y));
      vec3 q = floor(n*520.); c += stars * step(0.998, h(q)) * smoothstep(0.08, 0.5, n.y) * 0.5;
      gl_FragColor = vec4(c, 1.);
      #include <colorspace_fragment>
    }` })));
const moonU = { col: { value: new THREE.Color() }, flatK: { value: 0 } };
const moon = new THREE.Mesh(new THREE.SphereGeometry(34, 48, 24), new THREE.ShaderMaterial({ fog: false, uniforms: moonU,
  vertexShader: "varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: `varying vec3 p; uniform vec3 col; uniform float flatK;
    float hash(vec3 q){ return fract(sin(dot(q, vec3(127.1,311.7,74.7)))*43758.5453); }
    float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
    void main(){ vec3 q = normalize(p); float m = noise(q*3.)*.5 + noise(q*7.)*.3 + noise(q*15.)*.2;
      gl_FragColor = vec4(col * mix(0.75 + 0.3*m, 1., flatK), 1.);
      #include <colorspace_fragment>
    }` }));
moon.position.copy(MOON); scene.add(moon);
const halo = sprite(0xe04632, 320, 0.7, MOON); halo.material.fog = false;

// ---------------- far: three ridges, a pagoda on a far peak (scale), the sea of cloud below the cliff
const farMats = [];
for (const [z, base, h, s, w] of [[-300, -30, 36, 1.0, 1400], [-190, -30, 30, 2.3, 1000], [-110, -30, 24, 4.1, 700]]) {
  const sh = new THREE.Shape(); sh.moveTo(-w / 2, 0);
  for (let i = 0; i <= 120; i++) { const t = i / 120; sh.lineTo(-w / 2 + t * w, h * (0.45 + 0.3 * Math.sin(t * 7 + s) + 0.18 * Math.sin(t * 19 + s * 2) + 0.07 * Math.sin(t * 53 + s * 3))); }
  sh.lineTo(w / 2, 0); sh.closePath();
  const m = new THREE.MeshBasicMaterial({ fog: false }); farMats.push(m);
  const r = new THREE.Mesh(new THREE.ShapeGeometry(sh), m); r.position.set(0, base, z); scene.add(r);
}
const pagodaMat = new THREE.MeshBasicMaterial({ fog: false }); farMats.push(pagodaMat);
const PAGODA = V(-55, -12, -150);
{
  const g = new THREE.Group(); g.position.copy(PAGODA); scene.add(g);
  g.scale.setScalar(0.65); // its base is lost in the sea of cloud
  for (let i = 0; i < 5; i++) { const w = 6 - i * 0.8, y = i * 4.2; box(w * 0.6, 3.2, w * 0.6, pagodaMat, 0, y + 1.6, 0, g); box(w * 1.25, 0.5, w * 1.25, pagodaMat, 0, y + 3.4, 0, g); }
  box(0.25, 6, 0.25, pagodaMat, 0, 24, 0, g);
}
const cloudTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d");
  for (let i = 0; i < 70; i++) { const px = rand() * 256, py = rand() * 256, r = 20 + rand() * 50, g = x.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, "rgba(255,255,255,.35)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, 256, 256); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12); return t;
})();
const cloudMats = [];
for (const y of [-11, -14, -18]) {
  const m = new THREE.MeshBasicMaterial({ map: cloudTex, transparent: true, depthWrite: false, opacity: 0.7 }); cloudMats.push(m);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(900, 700), m); p.rotation.x = -Math.PI / 2; p.position.set(0, y, EDGE - 340); scene.add(p);
}

// ---------------- the garden: a platform on the cliff, raked gravel inside earthen walls with a tiled cap
box(88, 40, 50, M.stone, 4, -20, 17); // top at y 0, from the cliff edge (z −8) back to z 42
const wall = (x1, z1, x2, z2) => {
  const L = Math.hypot(x2 - x1, z2 - z1), g = new THREE.Group(); g.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2); g.rotation.y = -Math.atan2(z2 - z1, x2 - x1); scene.add(g);
  box(L, 2.2, 0.5, M.plaster, 0, 1.1, 0, g); box(L, 0.25, 0.6, M.wood, 0, 0.12, 0, g); // plaster on a dark plinth
  box(L + 0.3, 0.12, 1.0, M.tile, 0, 2.28, 0, g); box(L + 0.3, 0.14, 0.3, M.tile, 0, 2.4, 0, g); // the tiled cap and its ridge
};
wall(-14, EDGE, -14, 18); wall(22, EDGE, 22, 18); wall(-14, 18, -1.7, 18); wall(1.7, 18, 22, 18);
{ // the gate at the entrance
  for (const x of [-1.6, 1.6]) box(0.28, 2.9, 0.28, M.wood, x, 1.45, 18);
  box(3.9, 0.26, 0.32, M.wood, 0, 2.75, 18); box(4.8, 0.16, 1.6, M.tile, 0, 3.05, 18); box(4.8, 0.16, 0.4, M.tile, 0, 3.2, 18);
}
const gravelU = { rocks: { value: [V(0, -6, 1), ...ROCKS.map(([x, z, s]) => V(x, z, s))] }, cA: { value: new THREE.Color() }, cB: { value: new THREE.Color() }, fogC: { value: scene.fog.color }, fogD: { value: scene.fog.density } };
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(36, 26), new THREE.ShaderMaterial({ uniforms: gravelU,
    vertexShader: "varying vec3 w; varying float fd; void main(){ w = (modelMatrix*vec4(position,1.)).xyz; vec4 mv = viewMatrix*vec4(w,1.); fd = -mv.z; gl_Position = projectionMatrix*mv; }",
    fragmentShader: `uniform vec3 rocks[6]; uniform vec3 cA, cB, fogC; uniform float fogD; varying vec3 w; varying float fd;
      void main(){
        float l = sin(w.z*34.), inR = 0.;  // parallel rake lines, and rings around each rock
        for (int i = 0; i < 6; i++){ float d = length(w.xz - rocks[i].xy), r = rocks[i].z; float k = 1. - smoothstep(r*2.3, r*2.7, d); if (k > inR){ inR = k; l = mix(sin(w.z*34.), sin((d - r)*34.), k); } }
        float grain = fract(sin(dot(floor(w.xz*120.), vec2(12.9898,78.233)))*43758.5453);
        l *= 1. - 0.85*smoothstep(4., 15., fd); // lines fade with distance (no shimmer)
        vec3 c = mix(cA, cB, smoothstep(-1.2, 1.3, l)) * (0.88 + 0.24*grain);
        gl_FragColor = vec4(mix(c, fogC, 1. - exp(-fogD*fogD*fd*fd)), 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }` }));
  g.rotation.x = -Math.PI / 2; g.position.set(4, 0.004, 5); scene.add(g);
}
// stepping stones (flat discs until the generated ones are processed)
for (const [x, z] of STONES) { const d = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 0.12, 9), M.stone); d.position.set(x, 0.05, z); d.rotation.y = x * 3; scene.add(d); }
for (const k of KATA) { const d = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.6, 0.12, 9), M.stone); d.position.set(k.side * 1.6, 0.05, k.z); scene.add(d); }

// ---------------- tree placeholders: a curved trunk and flat, cloud-pruned pads (a strong, simple silhouette)
const padGeo = new THREE.IcosahedronGeometry(1, 1);
for (const [x, z, h, lean, turn] of TREES) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = turn; scene.add(g);
  const pts = [V(0, 0, 0), V(lean * 0.25 * h, 0.35 * h, 0), V(-lean * 0.05 * h, 0.65 * h, 0.06 * h), V(lean * 0.3 * h, 0.92 * h, 0)];
  const curve = new THREE.CatmullRomCurve3(pts);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.03 * h, 6), M.tree));
  [[0.5, 0.26], [0.66, 0.22], [0.8, 0.2], [0.95, 0.24], [1, 0.16]].forEach(([t, r], i) => {
    const p = curve.getPoint(Math.min(t, 1)), side = i % 2 ? 1 : -1, pad = new THREE.Mesh(padGeo, M.tree);
    pad.position.set(p.x + side * (i === 4 ? 0 : 0.22 * h), p.y + (i === 4 ? 0.06 * h : 0), p.z + (rand() - 0.5) * 0.15 * h);
    pad.scale.set(r * h, r * h * 0.3, r * h * 0.8); pad.rotation.y = rand() * 3; g.add(pad);
  });
}

// ---------------- lights (constant count; the theme only changes colours and intensities)
const hemi = new THREE.HemisphereLight(0x2a100c, 0x050202, 0.5); scene.add(hemi);
const key = new THREE.DirectionalLight(0xff5a48, 1.4); key.position.copy(MOON).normalize().multiplyScalar(40); scene.add(key, key.target);
const warm = [], glows = [];
const point = (int, dist, p) => { const l = new THREE.PointLight(0xffc985, int, dist, 1.5); l.position.copy(p); scene.add(l); warm.push([l, int]); return l; };
point(3, 7, V(HIS.x - 1, 2.6, HIS.z + 2.2));
const LANTERNS = KATA.map((k) => V(k.side * 2.5, 0, k.z + 0.6));
for (const p of LANTERNS) { point(4, 7, V(p.x, 1.4, p.z)); glows.push([sprite(0xffc985, 2.2, 0.6, V(p.x, 1.35, p.z)), 0.6]); }
point(12, 9, V(BRAZIER.x, 1.6, BRAZIER.z)); glows.push([sprite(0xffa060, 3, 0.8, V(BRAZIER.x, 1.5, BRAZIER.z)), 0.8]);
const rackLight = point(8, 10, V(ARMS.x - 1.5, 2.2, ARMS.z));
glows.push([sprite(0xffc985, 1.2, 0.9, V(PAGODA.x, PAGODA.y + 6, PAGODA.z + 2.5)), 0.9]); glows[glows.length - 1][0].material.fog = false; // a light in the far pagoda

// ---------------- WORK: four cut targets, top halves hanging mid-fall, straw frozen around them
TARGETS.forEach(([x, z], i) => {
  box(0.06, 0.9, 0.06, M.wood, x, 0.45, z);
  const lo = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 10), M.straw); lo.position.set(x, 1.05, z); scene.add(lo);
  const hi = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 10), M.straw); hi.position.set(x + 0.18, 1.72 - i * 0.05, z + 0.05); hi.rotation.z = -0.35 - i * 0.12; scene.add(hi);
  for (let j = 0; j < 8; j++) { const b = box(0.12, 0.006, 0.006, M.straw, x + 0.2 + rand() * 0.5, 1.2 + rand() * 0.4, z - 0.2 + rand() * 0.4); b.rotation.set(rand() * 3, rand() * 3, rand() * 3); }
});
{ // red drops flung off his blade, hanging in an arc
  const drop = new THREE.MeshBasicMaterial({ color: 0xc4453f });
  for (let i = 0; i < 14; i++) { const t = i / 13, m = new THREE.Mesh(new THREE.SphereGeometry(0.012 + rand() * 0.012, 6, 4), drop); m.position.set(P4AT.x + 0.9 + t * 0.9, 0.95 + Math.sin(t * 2.4) * 0.25, P4AT.z + 0.4 + t * 0.3); scene.add(m); }
}

// ---------------- particles: ash + embers in one draw; motion is a function of uTime only (frozen = zero cost)
const partU = { t: { value: 0 }, px: { value: renderer.getPixelRatio() }, cAsh: { value: new THREE.Color() }, cEmb: { value: new THREE.Color() } };
{
  const n = 2200, pos = new Float32Array(n * 3), kind = new Float32Array(n), sz = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos[i * 3] = -20 + rand() * 45; pos[i * 3 + 1] = -12 + rand() * 21; pos[i * 3 + 2] = -16 + rand() * 36; kind[i] = i < 250 ? 1 : 0; sz[i] = kind[i] ? 1.6 + rand() * 1.6 : 0.6 + rand() ** 3 * 2.5; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("kind", new THREE.BufferAttribute(kind, 1)); g.setAttribute("sz", new THREE.BufferAttribute(sz, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({ uniforms: partU, transparent: true, depthWrite: false,
    vertexShader: `attribute float kind; attribute float sz; uniform float t, px; uniform vec3 cAsh, cEmb; varying vec3 vC; varying float vA;
      void main(){ vec3 p = position;
        if (kind < .5) p += vec3(t*0.12 + sin(t*0.4 + position.y)*0.3, -t*0.1, sin(t*0.3 + position.x)*0.2);
        else p += vec3(sin(t*0.7 + position.z)*0.25, t*0.45, 0.);
        p = mod(p - vec3(-20., -12., -16.), vec3(45., 21., 36.)) + vec3(-20., -12., -16.);
        vec4 mv = modelViewMatrix*vec4(p,1.); gl_Position = projectionMatrix*mv; float d = -mv.z;
        gl_PointSize = clamp(sz*22./d, 1., 40.)*px; vC = kind < .5 ? cAsh : cEmb; vA = (kind < .5 ? .5 : 1.) * smoothstep(0.4, 1.6, d); }`,
    fragmentShader: "varying vec3 vC; varying float vA; void main(){ float a = 1. - smoothstep(.15, .5, length(gl_PointCoord - .5)); gl_FragColor = vec4(vC, a*vA); }" }));
  p.frustumCulled = false; scene.add(p);
}

// ------------------------------------------------------------------ themes: uniforms, colours and intensities only
// Light mode is soft overcast daylight: the models keep their materials (mid tones), distance fades to paper.
const THEMES = {
  dark: { top: 0x0b0303, hor: 0x3a0e0a, stars: 1, moon: 0xe0503e, flat: 0, halo: 0.7, fog: 0x160707, fogD: 0.028, gA: 0x161414, gB: 0x34302e, cloud: 0x3a1210, ash: 0x8a7e78, ember: 0xff6040,
    far: [0x2a0b09, 0x1c0706, 0x110404, 0x0d0303], hemi: [0x2a100c, 0x050202, 0.5], key: [0xff5a48, 1.4], warm: 1, ghost: 0xa04a44, exposure: 1,
    mats: { stone: 0x2c2b2c, plaster: 0x4a403a, tile: 0x141212, wood: 0x221813, tree: 0x16150f } },
  light: { top: 0xf3f0ea, hor: 0xdcd5ca, stars: 0, moon: 0xc4453f, flat: 1, halo: 0.12, fog: 0xe6e1d8, fogD: 0.034, gA: 0xc9c3b8, gB: 0xf4f1ec, cloud: 0xffffff, ash: 0x8f8a84, ember: 0xc4453f,
    far: [0xd6d0c5, 0xc4bcae, 0xaea595, 0x8f877b], hemi: [0xf4f1ec, 0x8a857e, 1.6], key: [0xfff2e6, 1.5], warm: 0, ghost: 0x6a625c, exposure: 1.05,
    mats: { stone: 0x8a8680, plaster: 0xc9bfae, tile: 0x4a4744, wood: 0x5a4a3e, tree: 0x4a5048 } },
};
const ghostMat = new THREE.PointsMaterial({ size: 0.012, transparent: true, opacity: 0.45, depthWrite: false });
const paper = [];
let theme = q.get("theme") === "light" ? "light" : "dark";
const applyTheme = () => {
  const T = THEMES[theme];
  skyU.top.value.set(T.top); skyU.hor.value.set(T.hor); skyU.stars.value = T.stars;
  moonU.col.value.set(T.moon); moonU.flatK.value = T.flat; halo.material.opacity = T.halo;
  scene.fog.color.set(T.fog); scene.fog.density = gravelU.fogD.value = T.fogD; gravelU.cA.value.set(T.gA); gravelU.cB.value.set(T.gB);
  for (const m of cloudMats) m.color.set(T.cloud);
  farMats.forEach((m, i) => m.color.set(T.far[i]));
  for (const k in T.mats) M[k].color.set(T.mats[k]);
  hemi.color.set(T.hemi[0]); hemi.groundColor.set(T.hemi[1]); hemi.intensity = T.hemi[2]; key.color.set(T.key[0]); key.intensity = T.key[1];
  for (const [l, k] of warm) l.intensity = k * T.warm;
  for (const [g, k] of glows) g.material.opacity = k * T.warm;
  for (const m of paper) m.emissiveIntensity = 0.9 * T.warm;
  partU.cAsh.value.set(T.ash); partU.cEmb.value.set(T.ember); ghostMat.color.set(T.ghost);
  renderer.toneMappingExposure = T.exposure;
  document.body.classList.toggle("light", theme === "light");
  document.getElementById("theme").textContent = theme === "dark" ? "light" : "dark";
};

// ------------------------------------------------------------------ assets
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const load = (n) => new Promise((res) => loader.load(`/public/experimental/v6/${n}.glb`, res, undefined, () => res(null)));
const topOf = (o) => new THREE.Box3().setFromObject(o).max.y;

// Freeze one frame of a clip and bake it into static meshes (no skinning at render time).
function bake(gltf, clipName, time) {
  const root = gltf.scene, mixer = new THREE.AnimationMixer(root), clip = gltf.animations.find((c) => c.name === clipName);
  const a = mixer.clipAction(clip).play(); a.time = Math.min(time, clip.duration - 0.001); mixer.update(0); root.updateMatrixWorld(true);
  const g = new THREE.Group(), v = V();
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const src = o.geometry, n = src.attributes.position.count, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { o.getVertexPosition(i, v); pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z; }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    if (src.attributes.uv) geo.setAttribute("uv", src.attributes.uv);
    geo.setIndex(src.index); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, o.material); m.applyMatrix4(o.matrixWorld); g.add(m);
  });
  mixer.stopAllAction();
  return g;
}
// The pose as a cloud of points: the "digital afterimage".
function ghostOf(pose) {
  const pts = [], v = V();
  pose.traverse((m) => { if (!m.isMesh) return; const p = m.geometry.attributes.position; for (let i = 0; i < p.count; i += 3) pts.push(...v.fromBufferAttribute(p, i).applyMatrix4(m.matrix).toArray()); });
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.Points(g, ghostMat);
}
// The height of the floor under (x, z), looking down from just under the eaves.
const floorAt = (obj, x, z) => new THREE.Raycaster(V(x, 1.9, z), V(0, -1, 0), 0, 3).intersectObject(obj, true)[0]?.point.y ?? 0;

const solid = {};
const ghosts = [];
Promise.all(["ronin", "his_stone", "lantern", "brazier", "weapons", "house"].map(load)).then(([ronin, stone, lantern, brazier, weapons, house]) => {
  if (stone) {
    const s = stone.scene; s.position.set(HIS.x, 0, HIS.z); scene.add(s); s.updateMatrixWorld(true);
    HIS.y = topOf(s); // he stands on its top
    for (const [x, z, k] of ROCKS) { const r = s.clone(); r.scale.setScalar(k); r.position.set(x, -0.15 * k, z); r.rotation.y = x * 1.7; scene.add(r); }
  }
  if (lantern) for (const p of LANTERNS) { const l = lantern.scene.clone(); l.position.copy(p); l.scale.setScalar(0.75); scene.add(l); }
  if (brazier) { brazier.scene.position.copy(BRAZIER); scene.add(brazier.scene); }
  if (house) {
    const h = house.scene; h.rotation.y = -Math.PI / 2; h.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(h); h.position.set(11.6 - b.min.x, 0, 5 - (b.min.z + b.max.z) / 2); scene.add(h); // veranda faces the garden
    h.updateMatrixWorld(true);
    // the veranda: the first raised floor going in from the front edge; the rack stands on it, against the shōji
    let x = 11.7, y = 0;
    for (; x < 15; x += 0.05) { y = floorAt(h, x, ARMS.z); if (y > 0.2) break; }
    ARMS.set(x + 0.55, y, ARMS.z); rackLight.position.set(ARMS.x - 1.6, ARMS.y + 1.6, ARMS.z);
    h.traverse((o) => { // v7's shōji glow: the bright texels of the paper become emissive
      if (!o.isMesh || !o.material?.map) return;
      const m = o.material; m.emissive = new THREE.Color(0xffe2b4); m.emissiveMap = m.map; paper.push(m);
      m.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace("#include <emissivemap_fragment>", "vec3 pt = texture2D(emissiveMap, vEmissiveMapUv).rgb; totalEmissiveRadiance *= smoothstep(0.62, 0.86, dot(pt, vec3(.299,.587,.114))) * pt;"); };
    });
  }
  if (weapons) { const w = weapons.scene; w.position.copy(ARMS); w.rotation.y = -Math.PI / 2; w.scale.setScalar(0.8); scene.add(w); }
  if (ronin) {
    const P = { P1: bake(ronin, "iai", 0.7), P2: bake(ronin, "iai", 1.2), P3: bake(ronin, "iai", 40 / 30), P4: bake(ronin, "iai", 1.9), P5: bake(ronin, "iai", 2.6), P6: bake(ronin, "idle", 0) };
    const place = (pose, at, look) => { const g = pose.clone(); g.position.copy(at); faceTo(g, look); scene.add(g); return g; };
    solid.his = { P1: place(P.P1, HIS, MOON), P6: place(P.P6, HIS, MOON) };
    solid.p4 = place(P.P4, P4AT, V(P4AT.x + 3, 0, P4AT.z + 1));
    KATA.forEach((k, i) => {
      const at = V(k.side * 1.6, 0.11, k.z), look = V(-k.side * 0.4, 0, k.z - 3.5); // facing the camera as it comes down the path
      const g = ghostOf(P[k.pose]); g.position.copy(at); faceTo(g, look); scene.add(g);
      ghosts.push({ points: g, body: place(P[k.pose], at, look), at: 4 + i });
    });
  }
  applyTheme();
  document.getElementById("load").remove();
});
applyTheme();

// ------------------------------------------------------------------ shots
// Orbit shots circle him: ang 0 = behind him (+Z side), ±180 = his front, his left is −X. Path shots: pos, target, mm.
const ORB = (ang, rad, y, ty, mm, side) => ({ orbit: { ang, rad, y, ty, mm, side } });
const AT = (p, t, mm, extra = {}) => ({ p, t, mm, ...extra });
const contact = (d, mm) => {
  const chest = V(HIS.x, 1.45, HIS.z), p = chest.clone().addScaledVector(chest.clone().sub(MOON).normalize(), d);
  p.y = Math.max(p.y, 0.6); return AT(p, MOON.clone().add(V(-40, -14, 0)), mm);
};
const SHOTS = [
  { id: "S01", name: "Hero · the moment before", pose: "P1 Metsuke", note: "time flowing: embers rise, ash drifts", c: ORB(-4.5, 3.4, 1.05, 1.45, 40, 0.75) },
  { id: "S02", name: "Time slows", pose: "P1 (no change)", note: "the orbit starts, clockwise round his left; embers decelerate to a stop", c: ORB(-60, 3.2, 1.15, 1.25, 38, 0.5) },
  { id: "S03", name: "About · bullet time", pose: "P1 (frozen)", note: "time stopped: the orbit continues, frozen particles parallax", c: ORB(-120, 3.2, 1.3, 1.25, 35, 0.6) },
  { id: "S03", name: "About · bullet time", pose: "P1 (frozen)", note: "…round to his front, sinking low", c: ORB(-180, 3.4, 0.9, 1.25, 35, 0.6) },
  ...KATA.map((k, i) => ({ id: "S04", name: `Approach · ${["Plan · 目付 Metsuke", "Build · 抜付 Nukitsuke", "Ship · 切付 Kiritsuke", "Sustain · 納刀 Nōtō"][i]}`, pose: `ghost ${k.pose}, solid while the camera is here`, note: "down the path toward the gate · condenses as you arrive, dissolves as you leave",
    c: AT(V(-k.side * 0.3, 0.8, k.z - 4.2), V(k.side * 1.6, 1.0, k.z), 30, i === 0 ? { pass: true } : {}) })),
  { id: "S05", name: "Work · what was cut", pose: "P4 Chiburi (stand-in)", note: "whip pan right from the last stone · halves hang mid-fall, red drops", c: AT(V(-4.2, 1.4, 14.5), V(-11, 0.9, 10.5), 36, { whip: true }) },
  { id: "S06", name: "Toolkit · tools I trust", pose: "no ronin", note: "foreground wipe past the tree · the rack on the veranda", c: { get p() { return V(ARMS.x - 2.8, ARMS.y + 0.9, ARMS.z - 0.8); }, get t() { return V(ARMS.x, ARMS.y + 0.6, ARMS.z + 0.2); }, mm: 42 } },
  { id: "S07", name: "Time resumes", pose: "P1 → P6 (swapped off-screen)", note: "dolly zoom 35 → 85 mm, the moon swells", c: { ...contact(5, 35), arc: true } },
  { id: "S08", name: "Contact", pose: "P6 Furikaeri (stand-in: idle)", note: "time flowing again · telephoto on the moon", c: contact(12, 85) },
];
const look = (p, t) => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(p, t, V(0, 1, 0)));
const orbitPose = (o) => {
  const a = (o.ang * Math.PI) / 180, p = V(HIS.x + Math.sin(a) * o.rad, o.y, HIS.z + Math.cos(a) * o.rad), chest = V(HIS.x, o.ty, HIS.z);
  const right = chest.clone().sub(p).cross(V(0, 1, 0)).normalize(); // aim beside him so he sits right of centre
  return { p, q: look(p, chest.addScaledVector(right, -o.side)), mm: o.mm };
};
const pose = (c) => (c.orbit ? orbitPose(c.orbit) : { p: c.p, q: look(c.p, c.t), mm: c.mm });
const camAt = (s) => {
  const i0 = Math.floor(clamp(s, 0, SHOTS.length - 1)), i1 = Math.min(i0 + 1, SHOTS.length - 1);
  const A = SHOTS[i0].c, B = SHOTS[i1].c;
  let u = smooth(s - i0);
  if (A.orbit && B.orbit) { const o = {}; for (const k in A.orbit) o[k] = lerp(A.orbit[k], B.orbit[k], u); return orbitPose(o); }
  if (B.whip) u = smooth(ramp(s - i0, 0.4, 0.6));
  const a = pose(A), b = pose(B), p = a.p.clone().lerp(b.p, u);
  if (B.pass) p.x += Math.sin(u * Math.PI) * 1.8; // from his front onto the path: the clockwise circle carries on round his right, not through him
  if (B.arc) p.y += Math.sin(u * Math.PI) * 4;
  return { p, q: a.q.clone().slerp(b.q, u), mm: lerp(a.mm, b.mm, u) };
};

// ------------------------------------------------------------------ controls
const slider = document.getElementById("s");
let s = +(q.get("s") ?? 0);
const SNAP = q.has("s");
slider.value = s;
const go = (v) => { s = clamp(v, 0, SHOTS.length - 1); slider.value = s; };
slider.oninput = () => (s = +slider.value);
addEventListener("wheel", (e) => go(s + e.deltaY * 0.0012), { passive: true });
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(Math.floor(s + 1.001)); if (e.key === "ArrowLeft") go(Math.ceil(s - 1.001)); });
document.getElementById("next").onclick = () => go(Math.floor(s + 1.001));
document.getElementById("prev").onclick = () => go(Math.ceil(s - 1.001));
document.getElementById("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); };
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ------------------------------------------------------------------ frame
const FROZEN = [1, 10]; // time slows to a stop over S01 → S02, resumes over S07 → S08
const hud = document.getElementById("hud"), tc = document.getElementById("tc");
const cur = { p: V(), q: new THREE.Quaternion(), mm: 50 };
let clock = SNAP ? 4 : 0, last = performance.now(), first = true, shown = -1;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
  // time: flows, slows to a stop, stays frozen (scrubbed a little by scroll), then resumes
  const scale = s < FROZEN[0] ? 1 - smooth(s / FROZEN[0]) : s < FROZEN[1] ? 0 : smooth(ramp(s, FROZEN[1], FROZEN[1] + 1));
  if (!SNAP) clock += dt * scale;
  const t = clock + 0.3 * clamp(s - FROZEN[0], 0, FROZEN[1] - FROZEN[0]);
  partU.t.value = t;

  const c = camAt(s), k = first || SNAP ? 1 : 1 - Math.exp(-dt * 6); first = false;
  cur.p.lerp(c.p, k); cur.q.slerp(c.q, k); cur.mm = lerp(cur.mm, c.mm, k);
  camera.position.copy(cur.p); camera.quaternion.copy(cur.q); camera.fov = mmToFov(cur.mm); camera.updateProjectionMatrix();

  if (solid.his) {
    solid.his.P1.visible = s < 8.5; solid.his.P6.visible = s >= 8.5; // swapped while the camera is at Work / Toolkit
    for (const g of ghosts) { const near = Math.abs(s - g.at) < 0.35; g.body.visible = near; g.points.visible = !near && s < 9.5; }
  }

  const i = Math.round(s);
  if (i !== shown) { shown = i; const S = SHOTS[i]; hud.innerHTML = `<i>${S.id}</i> · ${i + 1}/${SHOTS.length}<b>${S.name}</b>pose: ${S.pose}<br>${S.note}`; }
  tc.innerHTML = `刹那 ${new Date(t * 1000).toISOString().slice(11, 23)} ${scale === 0 ? "<i style='color:#c4453f'>■ frozen</i>" : ""}`;
  renderer.render(scene, camera);
});
</script>
</body>
